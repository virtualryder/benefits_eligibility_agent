# benefits-eligibility/manifest.yaml
# SLG vertical: a governed public-benefits eligibility-screening & determination-support agent (a human
# caseworker makes and commits the determination), built on the same
# governed-hero-agent pattern as the pharmacovigilance agent. The agent screens and recommends; a
# caseworker makes and commits the determination at the human sign-off gate. render.py turns this
# manifest into the deploy inputs.

agent:
  slug: benefits-eligibility
  title: Benefits Eligibility Screening and Determination Support
  industry: SLG
  region: us-east-1
  prefix: ben

identity:                          # stable, long-lived (own lifecycle)
  pool_name: ben-eligibility
  client_name: ben-gw
  reviewer_group: benefits_caseworker
  users:                           # placeholder passwords — override via env / rotate before shared use
    - { name: caseworker, password: "ChangeMe-Reviewer1!", in_group: true }
    - { name: approver,   password: "ChangeMe-Approver1!", in_group: true }
    - { name: outsider,   password: "ChangeMe-Outsider1!", in_group: false }

engine:
  name: ben_eligibility_authz
  description: Deny-by-default Cedar authz for the benefits eligibility agent

gateway:
  name: ben-eligibility-gw
  description: Benefits eligibility governed tool gateway
  ssm_discovery_param: /ben-eligibility/gateway-url

guardrail:
  name: ben-eligibility-guardrail
  description: "Fail-closed output control for benefits notices: PII anonymize + prompt-attack"
  pii_anonymize: [NAME, AGE, EMAIL, PHONE, US_SOCIAL_SECURITY_NUMBER, ADDRESS]
  prompt_attack: HIGH

controls:
  fail_closed_masking: true
  worm_audit: true
  human_signoff_gate: true

audit:
  object_lock_mode: GOVERNANCE
  retention_days: 1

model:
  draft_model_id: us.anthropic.claude-sonnet-4-5-20250929-v1:0

runtime:
  name: benefits_runtime_agent

tools:
  - target: intake-application
    lambda: ben-intake-application
    handler: intake_application.py
    kind: domain
    mcp_tools:
      - name: intake_application
        description: "Extract the non-PII decision fields (household size, monthly income, liquid resources, categorical flag) from a raw benefits application."
        input:
          application: { type: string, description: "Raw benefits application text or JSON (dev/direct calls only)." }
          case_ref: { type: string, description: "R3-2 pass-by-reference: the opaque case_ref from ingest; the tool loads the application server-side." }
        required: []

  - target: mask-pii
    lambda: ben-mask-pii
    handler: mask_pii.py
    kind: control
    mcp_tools:
      - name: mask_pii
        description: "Fail-closed PII de-identification of an application (name, SSN, address, DOB, etc.); sets deidentified=true only if masking succeeded."
        input:
          case: { type: string, description: "Application text that may contain PII (dev/direct calls only)." }
          case_ref: { type: string, description: "R3-2 pass-by-reference: the opaque case_ref from ingest; the tool loads the application server-side." }
        required: []

  - target: assess-eligibility
    lambda: ben-assess-eligibility
    handler: assess_eligibility.py
    kind: domain
    mcp_tools:
      - name: assess_eligibility
        description: "Deterministic income-based eligibility + processing-clock determination (expedited vs standard) on de-identified decision fields; case must be masked first (deidentified true)."
        input:
          household_size: { type: integer, description: "Number of people in the household." }
          monthly_income: { type: number, description: "Gross monthly household income." }
          liquid_resources: { type: number, description: "Liquid resources (cash/savings)." }
          categorical_eligibility: { type: boolean, description: "True if the household receives SSI/TANF/GA." }
          deidentified: { type: boolean, description: "True if masked by mask_pii." }
          sanitized_ref: { type: object, description: "The signed sanitized_ref returned by mask_pii (proof of de-identification; pass it verbatim)." }
        required: [deidentified, sanitized_ref]

  - target: redetermine
    lambda: ben-redetermine
    handler: redetermine.py
    kind: domain
    mcp_tools:
      - name: redetermine
        description: "Changed-circumstances re-determination on de-identified facts; classifies the change (ADVERSE / FAVORABLE / NO_CHANGE) and flags whether advance due-process notice is required. Case must be masked first."
        input:
          household_size: { type: integer, description: "New household size." }
          monthly_income: { type: number, description: "New gross monthly income." }
          categorical_eligibility: { type: boolean, description: "True if receives SSI/TANF/GA." }
          prior_determination: { type: string, description: "The prior determination (e.g. 'ELIGIBLE')." }
          prior_eligible: { type: boolean, description: "Prior eligibility, if known (overrides prior_determination)." }
          deidentified: { type: boolean, description: "True if masked by mask_pii." }
          sanitized_ref: { type: object, description: "The signed sanitized_ref returned by mask_pii (proof of de-identification; pass it verbatim)." }
        required: [deidentified, sanitized_ref]

  - target: overpayment
    lambda: ben-overpayment
    handler: overpayment.py
    kind: domain
    mcp_tools:
      - name: detect_overpayment
        description: "Deterministic overpayment calculation on de-identified benefit amounts (prior vs corrected monthly benefit over N months). Recovery/referral remain human decisions. Case must be masked first."
        input:
          prior_monthly_benefit: { type: number, description: "Amount received per month." }
          corrected_monthly_benefit: { type: number, description: "Corrected monthly entitlement." }
          months: { type: integer, description: "Number of months in the overpayment period." }
          deidentified: { type: boolean, description: "True if masked by mask_pii." }
          sanitized_ref: { type: object, description: "The signed sanitized_ref returned by mask_pii (proof of de-identification; pass it verbatim)." }
        required: [deidentified, sanitized_ref]

  - target: ben-core
    lambda: ben-core-tools
    handler: benefits_core.py
    kind: domain
    guardrailed: true
    mcp_tools:
      - name: draft_notice
        description: "Draft a de-identified benefits determination notice; case must be masked first."
        input:
          case: { type: string, description: "De-identified case + determination JSON/text (optional when sanitized_ref is given: the drafter loads the masked text server-side)." }
          deidentified: { type: boolean, description: "True if masked by mask_pii." }
          sanitized_ref: { type: object, description: "The signed sanitized_ref returned by mask_pii (proof of de-identification; pass it verbatim)." }
        required: [deidentified, sanitized_ref]
      - name: finalize_determination
        description: "Commit a benefits determination; agent must never call this directly."
        input: { case_id: { type: string, description: "Case id." } }
        required: [case_id]
      - name: refer_fraud
        description: "Refer a case as suspected fraud; a HUMAN-only decision — the agent must never call this."
        input: { fraud_case_id: { type: string, description: "Case id to refer." } }
        required: [fraud_case_id]

  - target: write-audit
    lambda: ben-write-audit
    handler: write_audit.py
    kind: control
    mcp_tools:
      - name: write_audit
        description: "Append a tamper-evident audit record (append-only ledger + WORM copy); returns stored=false if the exact record already exists."
        input:
          icsr_id: { type: string, description: "Case/record id." }
          action: { type: string, description: "Governed action being recorded." }
          phase: { type: string, description: "INTENT or COMMITTED." }
          actor: { type: string, description: "Who acted." }
          payload: { type: string, description: "Evidence payload (JSON string)." }
        required: [icsr_id, action, phase]

  - target: request-signoff
    lambda: ben-request-signoff
    handler: request_signoff.py
    kind: control
    mcp_tools:
      - name: request_signoff
        description: "Request caseworker sign-off before committing a determination; starts a separation-of-duties approval workflow. The agent can never commit directly."
        input:
          icsr_id: { type: string, description: "Case/record id." }
        required: [icsr_id]
        # P0-3: NO credential field in any tool schema — the model can never be asked to supply a bearer
        # token. The trusted runtime scrubs credential-shaped args and injects the requester's validated
        # access token OUT-OF-BAND into this call only (lib/runtime/token_boundary.py); the Lambda still
        # re-verifies it (identity.verify_access_token). Requester identity is derived at the boundary.

policies:
  - { name: caseworker_permit,        kind: permit, role_group: benefits_caseworker }
  - { name: mask_before_assess,       kind: forbid, action: assess_eligibility, unless_deidentified: true }
  - { name: mask_before_redetermine,  kind: forbid, action: redetermine,        unless_deidentified: true }
  - { name: mask_before_overpayment,  kind: forbid, action: detect_overpayment, unless_deidentified: true }
  - { name: mask_before_draft,        kind: forbid, action: draft_notice,       unless_deidentified: true }
  - { name: no_self_commit,           kind: forbid, action: finalize_determination }
  - { name: no_self_fraud_referral,   kind: forbid, action: refer_fraud }
  # phase 108 (hybrid multi-tenant): un-tenanted identities are refused at the gateway. Attached ONLY in
  # multi-tenant deployments (scope: multitenant) - silo principals carry no custom:tenant tag.
  - { name: require_tenant,           kind: forbid, require_tenant: true, scope: multitenant }
  # --- Full 9-condition Cedar model (#160 entitlement + #161 consent/purpose/budget/temporal/quantitative) ---
  # ENTITLEMENT (#160): zero-default tools - no NON-EMPTY custom:tools claim => no tool at all, even for a
  # role-group member. Defense in depth for the interceptor, which already drops the tool list on a missing claim.
  - { name: require_entitlement,      kind: forbid, require_entitlement: true }
  # TEMPORAL: no governed action outside the deployment's service window (within_service_window is set by the
  # gateway interceptor from the real request time; caller values are overwritten).
  - { name: require_service_window,   kind: forbid, require_service_window: true, scope: temporal, actions: [assess_eligibility, redetermine, detect_overpayment, draft_notice] }
  # CONSENT + PURPOSE on the eligibility decision. Coarse gateway gates on the authoritative server-side controls.
  - { name: consent_purpose_before_assess, kind: forbid, action: assess_eligibility, require_consent: true, allowed_purposes: [eligibility, redetermination] }
  # BUDGET on the model-spending drafter (budget_ok is interceptor-injected from the live per-tenant meter).
  - { name: budget_before_draft,      kind: forbid, action: draft_notice, require_budget_ok: true }
  # QUANTITATIVE: an overpayment computation above the caseworker amount cap is refused (elevated auth only).
  - { name: amount_cap_overpayment,   kind: forbid, action: detect_overpayment, amount_limit: 5000, amount_field: prior_monthly_benefit }

workflow:
  entrypoint: agent.py
  consequential_action: finalize_determination
  steps:
    - "intake_application - extract the non-PII decision fields from the raw application."
    - "mask_pii - de-identify the raw application; use the returned masked_case for the notice and audit."
    - "assess_eligibility - on the extracted fields with deidentified true, determine eligibility and the processing clock (expedited vs standard)."
    - "draft_notice - draft the determination notice, passing the masked case and deidentified true."
    - "write_audit - record an INTENT audit entry for the determination."
    - "request_signoff - request caseworker sign-off to commit (a DIFFERENT qualified person must approve)."

honesty_boundary:
  stubbed: [verify_income, connect_system_of_record]
  connectors: "state benefits system / eligibility system integration is customer engagement work"
  not_certified: true

# --- Minimum Bar gates 4/5/8/9 — declarative blocks (added 2026-08-20) -------
# See pharmacovigilance manifest for rationale; render.py ignores unknown keys.

grounding:                       # bar 4 — declared grounding source + threshold
  source: fpl_reference_data     # FPL-pinned eligibility tables (FPL-pinned test)
  grounding_threshold: 0.85      # pilot-tunable; PQ evidence sets the floor
  relevance_threshold: 0.80

budget:                          # bar 5 — hard cap; benefits data fails closed
  # ENFORCED LIVE since 2026-09-03 (governed-core 1.9.0, task 128): cdk/app.py reads this block into every
  # governed Lambda + the Runtime (BUDGET_CAP_TOKENS / BUDGET_BEHAVIOR); the per-tenant meter lives in
  # <prefix>-budgets; alert_thresholds become CloudWatch alarms on Aegis/Budget TokensUsedPct + UsdUsedPct;
  # the USD ceiling is `-c budget_usd` (AWS Budgets + kill switch). Proof: evidence/AGENTCORE-BUDGET-2026-09-03.md
  monthly_token_cap: 5000000
  inference_profile: ben-agent   # informational — the pinned model id is DRAFT_MODEL_ID / lib/model_prices.json
  cap_behavior: hard             # hard = fail-closed refusal; soft = flag + continue
  alert_thresholds: [0.6, 0.85, 1.0]

evals:                           # bar 6 — suite + declared rate
  suite: tests/
  min_pass_rate: 1.0

pack: SLG                        # bar 9 — pack compatibility declaration

signing:                         # bar 8 — signed by a known publisher
  publisher: virtualryder
  algorithm: rsassa-pss-sha256
  signature: null                # UNSIGNED — delivery gate blocks until signed
